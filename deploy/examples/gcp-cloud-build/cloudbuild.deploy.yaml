# Cloud Build deploy example for OSS users.
#
# Trigger deploys from a protected branch or release tag only. Do not reuse this
# config for pull request CI.
# Operational retry for issue #623; no deploy behavior changes.
timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _ENV: staging
  _REGION: asia-east1
  _ARTIFACT_REPO: pufu-lens
  _RUNTIME_SERVICE_ACCOUNT: ''
  _SCHEDULER_SERVICE_ACCOUNT: ''
  _STORAGE_BUCKET: ''
  _VPC_NETWORK: default
  _VPC_SUBNET: pufu-lens-serverless
  _MASTRA_SERVICE: mastra-server
  _MASTRA_IMAGE: mastra-server
  _JOBS_IMAGE: workflow-job
  _FIREBASE_DEPLOY: 'true'
  _FIREBASE_TOOLS_VERSION: 15.25.1
  _RUN_DB_MIGRATIONS: 'true'
  _DB_MIGRATION_JOB: db-migrate
  _SOURCE_SYNC_DISPATCHER_JOB: source-sync-dispatcher
  _SOURCE_SYNC_SCHEDULER: source-sync-dispatcher
  _REPORT_SCHEDULE_DISPATCHER_JOB: report-schedule-dispatcher
  _REPORT_SCHEDULE_SCHEDULER: report-schedule-dispatcher
  _ACTIVITYPUB_DISPATCHER_JOB: activitypub-dispatcher
  _ACTIVITYPUB_DISPATCHER_SCHEDULER: activitypub-dispatcher
  _ACTIVITYPUB_CANONICAL_ORIGIN: ''
  _ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE: ''
  _ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT: ''
  _ACTIVITYPUB_ACTOR_KEY_SECRET: ''
  _CHAT_MODEL: google/gemini-2.5-flash
  _CHAT_API_KEY_ENV: GEMINI_API_KEY
  _CHAT_API_KEY_SECRET: GEMINI_API_KEY
  _EMBEDDING_PROVIDER: gemini
  _EMBEDDING_MODEL: gemini-embedding-2
  _EMBEDDING_DIMENSIONS: '1536'
  _EMBEDDING_API_KEY_SECRET: GEMINI_API_KEY

steps:
  - id: validate-deploy-substitutions
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        case "${_ENV}" in
          staging|production) ;;
          *)
            echo "_ENV must be staging or production." >&2
            exit 1
            ;;
        esac

        for pair in \
          "_REGION=${_REGION}" \
          "_ARTIFACT_REPO=${_ARTIFACT_REPO}" \
          "_RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}" \
          "_SCHEDULER_SERVICE_ACCOUNT=${_SCHEDULER_SERVICE_ACCOUNT}" \
          "_STORAGE_BUCKET=${_STORAGE_BUCKET}" \
          "_VPC_NETWORK=${_VPC_NETWORK}" \
          "_VPC_SUBNET=${_VPC_SUBNET}" \
          "_MASTRA_SERVICE=${_MASTRA_SERVICE}" \
          "_MASTRA_IMAGE=${_MASTRA_IMAGE}" \
          "_JOBS_IMAGE=${_JOBS_IMAGE}" \
          "_CHAT_MODEL=${_CHAT_MODEL}" \
          "_CHAT_API_KEY_SECRET=${_CHAT_API_KEY_SECRET}" \
          "_EMBEDDING_MODEL=${_EMBEDDING_MODEL}" \
          "_EMBEDDING_API_KEY_SECRET=${_EMBEDDING_API_KEY_SECRET}"; do
          name="$${pair%%=*}"
          value="$${pair#*=}"
          if [[ -z "$${value}" ]]; then
            echo "$${name} is required." >&2
            exit 1
          fi
        done

        case "${_CHAT_API_KEY_ENV}" in
          GEMINI_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY) ;;
          *)
            echo "_CHAT_API_KEY_ENV must be GEMINI_API_KEY, OPENAI_API_KEY, or ANTHROPIC_API_KEY." >&2
            exit 1
            ;;
        esac

        case "${_CHAT_MODEL}:${_CHAT_API_KEY_ENV}" in
          google/*:GEMINI_API_KEY|openai/*:OPENAI_API_KEY|anthropic/*:ANTHROPIC_API_KEY) ;;
          *)
            echo "_CHAT_MODEL provider must match _CHAT_API_KEY_ENV (google/GEMINI_API_KEY, openai/OPENAI_API_KEY, or anthropic/ANTHROPIC_API_KEY)." >&2
            exit 1
            ;;
        esac

        case "${_EMBEDDING_PROVIDER}" in
          gemini|openai) ;;
          *)
            echo "_EMBEDDING_PROVIDER must be gemini or openai." >&2
            exit 1
            ;;
        esac

        if [[ "${_EMBEDDING_DIMENSIONS}" != "1536" ]]; then
          echo "_EMBEDDING_DIMENSIONS must be 1536." >&2
          exit 1
        fi

        if [[ -z "${_SOURCE_SYNC_DISPATCHER_JOB}" || -z "${_SOURCE_SYNC_SCHEDULER}" ]]; then
          echo "_SOURCE_SYNC_DISPATCHER_JOB and _SOURCE_SYNC_SCHEDULER are required." >&2
          exit 1
        fi

        if [[ -z "${_REPORT_SCHEDULE_DISPATCHER_JOB}" || -z "${_REPORT_SCHEDULE_SCHEDULER}" ]]; then
          echo "_REPORT_SCHEDULE_DISPATCHER_JOB and _REPORT_SCHEDULE_SCHEDULER are required." >&2
          exit 1
        fi

        if [[ -z "${_ACTIVITYPUB_DISPATCHER_JOB}" || -z "${_ACTIVITYPUB_DISPATCHER_SCHEDULER}" ]]; then
          echo "_ACTIVITYPUB_DISPATCHER_JOB and _ACTIVITYPUB_DISPATCHER_SCHEDULER are required." >&2
          exit 1
        fi

        if [[ -z "${_ACTIVITYPUB_CANONICAL_ORIGIN}" || -z "${_ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE}" || -z "${_ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT}" || -z "${_ACTIVITYPUB_ACTOR_KEY_SECRET}" ]]; then
          echo "_ACTIVITYPUB_CANONICAL_ORIGIN, _ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE, _ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT, and _ACTIVITYPUB_ACTOR_KEY_SECRET are required." >&2
          exit 1
        fi

        export _ACTIVITYPUB_CANONICAL_ORIGIN="${_ACTIVITYPUB_CANONICAL_ORIGIN}"
        export _ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE="${_ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE}"
        python3 - <<'PY'
        import os
        import sys
        from urllib.parse import urlparse

        def validate_https_origin(value: str, name: str) -> None:
            parsed = urlparse(value)
            if parsed.scheme != "https":
                print(f"{name} must be an HTTPS origin.", file=sys.stderr)
                sys.exit(1)
            if parsed.username or parsed.password:
                print(f"{name} must not include credentials.", file=sys.stderr)
                sys.exit(1)
            if parsed.query or parsed.fragment:
                print(f"{name} must not include query or fragment.", file=sys.stderr)
                sys.exit(1)
            if parsed.path not in ("", "/"):
                print(f"{name} must not include a path.", file=sys.stderr)
                sys.exit(1)
            if not parsed.hostname:
                print(f"{name} must include a hostname.", file=sys.stderr)
                sys.exit(1)
            try:
                port = parsed.port
            except ValueError:
                print(f"{name} must be a valid HTTPS origin.", file=sys.stderr)
                sys.exit(1)
            if port is not None and (port < 1 or port > 65535):
                print(f"{name} must be a valid HTTPS origin.", file=sys.stderr)
                sys.exit(1)

        validate_https_origin(
            os.environ["_ACTIVITYPUB_CANONICAL_ORIGIN"],
            "_ACTIVITYPUB_CANONICAL_ORIGIN",
        )
        validate_https_origin(
            os.environ["_ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE"],
            "_ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE",
        )
        PY

        if ! [[ "${_ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT}" =~ ^[0-9]+$ ]]; then
          echo "_ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT must contain ASCII digits only." >&2
          exit 1
        fi

        scheduler_unique_id="$$(gcloud iam service-accounts describe "${_SCHEDULER_SERVICE_ACCOUNT}" --format='value(uniqueId)')"
        if [[ "$${scheduler_unique_id}" != "${_ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT}" ]]; then
          echo "_ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT must match the scheduler service account uniqueId." >&2
          exit 1
        fi

        if ! gcloud secrets describe "${_ACTIVITYPUB_ACTOR_KEY_SECRET}" >/dev/null 2>&1; then
          echo "_ACTIVITYPUB_ACTOR_KEY_SECRET secret not found." >&2
          exit 1
        fi

        enabled_secret_versions="$$(gcloud secrets versions list "${_ACTIVITYPUB_ACTOR_KEY_SECRET}" --filter='state:ENABLED' --format='value(name)' | wc -l | tr -d ' ')"
        if [[ "$${enabled_secret_versions}" -lt 1 ]]; then
          echo "_ACTIVITYPUB_ACTOR_KEY_SECRET must have at least one ENABLED version." >&2
          exit 1
        fi

        case "${_RUN_DB_MIGRATIONS}" in
          true|false) ;;
          *)
            echo "_RUN_DB_MIGRATIONS must be true or false." >&2
            exit 1
            ;;
        esac

        if [[ "${_RUN_DB_MIGRATIONS}" == "true" && -z "${_DB_MIGRATION_JOB}" ]]; then
          echo "_DB_MIGRATION_JOB is required when _RUN_DB_MIGRATIONS is true." >&2
          exit 1
        fi

  - id: build-mastra-server
    name: gcr.io/cloud-builders/docker
    waitFor:
      - validate-deploy-substitutions
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_MASTRA_IMAGE}"
        docker buildx create --name mastra-cache-builder --driver docker-container --use || docker buildx use mastra-cache-builder
        docker buildx inspect --bootstrap
        docker buildx build \
          --cache-from "type=registry,ref=$${image}:buildcache" \
          --cache-to "type=registry,ref=$${image}:buildcache,mode=max" \
          --file infra/docker/mastra/Dockerfile \
          --tag "$${image}:${SHORT_SHA}" \
          --tag "$${image}:latest" \
          --load \
          .

  - id: push-mastra-server
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-mastra-server
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_MASTRA_IMAGE}

  - id: build-workflow-job
    name: gcr.io/cloud-builders/docker
    waitFor:
      - validate-deploy-substitutions
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_JOBS_IMAGE}"
        docker buildx create --name jobs-cache-builder --driver docker-container --use || docker buildx use jobs-cache-builder
        docker buildx inspect --bootstrap
        docker buildx build \
          --cache-from "type=registry,ref=$${image}:buildcache" \
          --cache-to "type=registry,ref=$${image}:buildcache,mode=max" \
          --file infra/docker/jobs/Dockerfile \
          --tag "$${image}:${SHORT_SHA}" \
          --tag "$${image}:latest" \
          --load \
          .

  - id: push-workflow-job
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-workflow-job
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_JOBS_IMAGE}

  - id: run-db-migration
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - push-workflow-job
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ "${_RUN_DB_MIGRATIONS}" != "true" ]]; then
          echo "Skipping DB migration because _RUN_DB_MIGRATIONS is not true."
          exit 0
        fi

        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_JOBS_IMAGE}:${SHORT_SHA}"
        job_args=(
          "${_DB_MIGRATION_JOB}"
          --image "${image}"
          --region "${_REGION}"
          --service-account "${_RUNTIME_SERVICE_ACCOUNT}"
          --network "${_VPC_NETWORK}"
          --subnet "${_VPC_SUBNET}"
          --vpc-egress private-ranges-only
          --clear-vpc-connector
          --command pnpm
          --args db:migrate
          --tasks 1
          --max-retries 0
          --set-secrets "DATABASE_URL=DATABASE_URL:latest"
        )

        not_found_pattern='NOT_FOUND|not found|cannot find job|could not be found|does not exist'
        describe_error="$$(mktemp)"
        if gcloud run jobs describe "${_DB_MIGRATION_JOB}" --region "${_REGION}" >/dev/null 2>"$${describe_error}"; then
          gcloud run jobs update "${job_args[@]}"
        else
          describe_status="$${?}"
          if grep -Eiq "$${not_found_pattern}" "$${describe_error}"; then
            echo "Creating DB migration job ${_DB_MIGRATION_JOB} because it does not exist."
            rm -f "$${describe_error}"
            gcloud run jobs create "${job_args[@]}"
          else
            cat "$${describe_error}" >&2
            rm -f "$${describe_error}"
            exit "$${describe_status}"
          fi
        fi
        rm -f "$${describe_error}"

        gcloud run jobs execute "${_DB_MIGRATION_JOB}" --region "${_REGION}" --wait

  - id: deploy-mastra-server
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - push-mastra-server
      - run-db-migration
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        gcloud run deploy "${_MASTRA_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_MASTRA_IMAGE}:${SHORT_SHA}" \
          --region "${_REGION}" \
          --service-account "${_RUNTIME_SERVICE_ACCOUNT}" \
          --network "${_VPC_NETWORK}" \
          --subnet "${_VPC_SUBNET}" \
          --vpc-egress private-ranges-only \
          --clear-vpc-connector \
          --no-allow-unauthenticated \
          --port 8080 \
          --set-env-vars "STORAGE_DRIVER=gcs,STORAGE_BUCKET=${_STORAGE_BUCKET},PUFU_LENS_CHAT_MODEL=${_CHAT_MODEL},PUFU_LENS_EMBEDDING_PROVIDER=${_EMBEDDING_PROVIDER},PUFU_LENS_EMBEDDING_MODEL=${_EMBEDDING_MODEL},PUFU_LENS_EMBEDDING_DIMENSIONS=${_EMBEDDING_DIMENSIONS},GEMINI_CHAT_MODEL=gemini-2.5-flash,GOOGLE_GENAI_USE_VERTEXAI=false,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},CLOUD_RUN_JOBS_REGION=${_REGION},SOURCE_SYNC_DISPATCHER_JOB_NAME=${_ENV}-${_SOURCE_SYNC_DISPATCHER_JOB},REPORT_SCHEDULE_DISPATCHER_JOB_NAME=${_ENV}-${_REPORT_SCHEDULE_DISPATCHER_JOB},ACTIVITYPUB_DISPATCHER_JOB_NAME=${_ENV}-${_ACTIVITYPUB_DISPATCHER_JOB},ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT=${_ACTIVITYPUB_DISPATCHER_SCHEDULER_SUBJECT},ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE=${_ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE},SCHEDULER_SERVICE_ACCOUNT=${_SCHEDULER_SERVICE_ACCOUNT},ACTIVITYPUB_CANONICAL_ORIGIN=${_ACTIVITYPUB_CANONICAL_ORIGIN},ACTIVITYPUB_ENABLED=1" \
          --set-secrets "DATABASE_URL=DATABASE_URL:latest,${_CHAT_API_KEY_ENV}=${_CHAT_API_KEY_SECRET}:latest,PUFU_LENS_EMBEDDING_API_KEY=${_EMBEDDING_API_KEY_SECRET}:latest,ACTIVITYPUB_ACTOR_KEY_ENCRYPTION_KEY=${_ACTIVITYPUB_ACTOR_KEY_SECRET}:latest"

        mkdir -p /workspace/.cloudbuild
        gcloud run services describe "${_MASTRA_SERVICE}" \
          --region "${_REGION}" \
          --format "value(status.url)" > /workspace/.cloudbuild/mastra-server-url

  - id: deploy-workflow-jobs
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - push-workflow-job
      - run-db-migration
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        for workflow_id in curate-workflow ingest-workflow generate-report source-sync-dispatcher report-schedule-dispatcher activitypub-dispatcher; do
          job_name="${_ENV}-$${workflow_id}"
          env_vars="STORAGE_DRIVER=gcs,STORAGE_BUCKET=${_STORAGE_BUCKET},WORKFLOW_ID=$${workflow_id},PUFU_LENS_CHAT_MODEL=${_CHAT_MODEL},PUFU_LENS_EMBEDDING_PROVIDER=${_EMBEDDING_PROVIDER},PUFU_LENS_EMBEDDING_MODEL=${_EMBEDDING_MODEL},PUFU_LENS_EMBEDDING_DIMENSIONS=${_EMBEDDING_DIMENSIONS},GEMINI_CHAT_MODEL=gemini-2.5-flash,GOOGLE_GENAI_USE_VERTEXAI=false"
          secrets="DATABASE_URL=DATABASE_URL:latest,${_CHAT_API_KEY_ENV}=${_CHAT_API_KEY_SECRET}:latest,PUFU_LENS_EMBEDDING_API_KEY=${_EMBEDDING_API_KEY_SECRET}:latest,AUTH_SECRET=AUTH_SECRET:latest"
          if [[ "$${workflow_id}" == "activitypub-dispatcher" ]]; then
            env_vars="STORAGE_DRIVER=gcs,STORAGE_BUCKET=${_STORAGE_BUCKET},WORKFLOW_ID=activitypub-dispatcher,ACTIVITYPUB_ENABLED=1,ACTIVITYPUB_CANONICAL_ORIGIN=${_ACTIVITYPUB_CANONICAL_ORIGIN},PUFU_LENS_CHAT_MODEL=${_CHAT_MODEL},PUFU_LENS_EMBEDDING_PROVIDER=${_EMBEDDING_PROVIDER},PUFU_LENS_EMBEDDING_MODEL=${_EMBEDDING_MODEL},PUFU_LENS_EMBEDDING_DIMENSIONS=${_EMBEDDING_DIMENSIONS},GEMINI_CHAT_MODEL=gemini-2.5-flash,GOOGLE_GENAI_USE_VERTEXAI=false"
            secrets="DATABASE_URL=DATABASE_URL:latest,${_CHAT_API_KEY_ENV}=${_CHAT_API_KEY_SECRET}:latest,PUFU_LENS_EMBEDDING_API_KEY=${_EMBEDDING_API_KEY_SECRET}:latest,AUTH_SECRET=AUTH_SECRET:latest,ACTIVITYPUB_ACTOR_KEY_ENCRYPTION_KEY=${_ACTIVITYPUB_ACTOR_KEY_SECRET}:latest"
          fi
          job_args=(
            "$${job_name}"
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_JOBS_IMAGE}:${SHORT_SHA}"
            --region "${_REGION}"
            --service-account "${_RUNTIME_SERVICE_ACCOUNT}"
            --network "${_VPC_NETWORK}"
            --subnet "${_VPC_SUBNET}"
            --vpc-egress private-ranges-only
            --clear-vpc-connector
            --set-env-vars "$${env_vars}"
            --set-secrets "$${secrets}"
          )
          if [[ "$${workflow_id}" == "source-sync-dispatcher" || "$${workflow_id}" == "report-schedule-dispatcher" || "$${workflow_id}" == "activitypub-dispatcher" ]]; then
            job_args+=(--tasks 1 --max-retries 0 --task-timeout 3300s)
          fi
          if gcloud run jobs describe "$${job_name}" --region "${_REGION}" >/dev/null 2>&1; then
            gcloud run jobs update "$${job_args[@]}"
          else
            gcloud run jobs create "$${job_args[@]}"
          fi
        done

  - id: deploy-source-sync-scheduler
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - deploy-mastra-server
      - deploy-workflow-jobs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        service_url="$$(cat /workspace/.cloudbuild/mastra-server-url)"
        scheduler_name="${_ENV}-${_SOURCE_SYNC_SCHEDULER}"
        scheduler_args=(
          --location "${_REGION}"
          --schedule "*/5 * * * *"
          --time-zone "Etc/UTC"
          --uri "$${service_url}/internal/schedules/source-sync-dispatcher:run"
          --http-method POST
          --message-body '{}'
          --oidc-service-account-email "${_SCHEDULER_SERVICE_ACCOUNT}"
          --oidc-token-audience "$${service_url}"
        )
        if gcloud scheduler jobs describe "$${scheduler_name}" --location "${_REGION}" >/dev/null 2>&1; then
          gcloud scheduler jobs update http "$${scheduler_name}" "$${scheduler_args[@]}" --update-headers "Content-Type=application/json"
        else
          gcloud scheduler jobs create http "$${scheduler_name}" "$${scheduler_args[@]}" --headers "Content-Type=application/json"
        fi

  - id: deploy-report-schedule-scheduler
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - deploy-mastra-server
      - deploy-workflow-jobs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        service_url="$$(cat /workspace/.cloudbuild/mastra-server-url)"
        scheduler_name="${_ENV}-${_REPORT_SCHEDULE_SCHEDULER}"
        scheduler_args=(
          --location "${_REGION}"
          --schedule "*/5 * * * *"
          --time-zone "Etc/UTC"
          --uri "$${service_url}/internal/schedules/report-schedule-dispatcher:run"
          --http-method POST
          --message-body '{}'
          --oidc-service-account-email "${_SCHEDULER_SERVICE_ACCOUNT}"
          --oidc-token-audience "$${service_url}"
        )
        if gcloud scheduler jobs describe "$${scheduler_name}" --location "${_REGION}" >/dev/null 2>&1; then
          gcloud scheduler jobs update http "$${scheduler_name}" "$${scheduler_args[@]}" --update-headers "Content-Type=application/json"
        else
          gcloud scheduler jobs create http "$${scheduler_name}" "$${scheduler_args[@]}" --headers "Content-Type=application/json"
        fi

  - id: deploy-activitypub-dispatcher-iam
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - deploy-mastra-server
      - deploy-workflow-jobs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        mastra_service_name="$$(gcloud run services list --region "${_REGION}" --filter="metadata.name=${_MASTRA_SERVICE}" --format='value(metadata.name)')"
        source_sync_job_name="${_ENV}-${_SOURCE_SYNC_DISPATCHER_JOB}"
        report_schedule_job_name="${_ENV}-${_REPORT_SCHEDULE_DISPATCHER_JOB}"
        activitypub_job_name="${_ENV}-${_ACTIVITYPUB_DISPATCHER_JOB}"
        gcloud run services add-iam-policy-binding "$${mastra_service_name}" \
          --region "${_REGION}" \
          --member "serviceAccount:${_SCHEDULER_SERVICE_ACCOUNT}" \
          --role "roles/run.invoker"
        for dispatcher_job_name in "$${source_sync_job_name}" "$${report_schedule_job_name}" "$${activitypub_job_name}"; do
          gcloud run jobs add-iam-policy-binding "$${dispatcher_job_name}" \
            --region "${_REGION}" \
            --member "serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
            --role "roles/run.jobsExecutorWithOverrides"
        done
        gcloud run jobs add-iam-policy-binding "$${activitypub_job_name}" \
          --region "${_REGION}" \
          --member "serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
          --role "roles/run.viewer"

  - id: deploy-activitypub-dispatcher-scheduler
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - deploy-mastra-server
      - deploy-workflow-jobs
      - deploy-activitypub-dispatcher-iam
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        service_url="$$(cat /workspace/.cloudbuild/mastra-server-url)"
        scheduler_name="${_ENV}-${_ACTIVITYPUB_DISPATCHER_SCHEDULER}"
        scheduler_args=(
          --location "${_REGION}"
          --schedule "*/5 * * * *"
          --time-zone "Etc/UTC"
          --uri "$${service_url}/internal/schedules/activitypub-dispatcher:run"
          --http-method POST
          --message-body '{}'
          --oidc-service-account-email "${_SCHEDULER_SERVICE_ACCOUNT}"
          --oidc-token-audience "${_ACTIVITYPUB_DISPATCHER_OIDC_AUDIENCE}"
        )
        if gcloud scheduler jobs describe "$${scheduler_name}" --location "${_REGION}" >/dev/null 2>&1; then
          gcloud scheduler jobs update http "$${scheduler_name}" "$${scheduler_args[@]}" --update-headers "Content-Type=application/json"
        else
          gcloud scheduler jobs create http "$${scheduler_name}" "$${scheduler_args[@]}" --headers "Content-Type=application/json"
        fi

  - id: deploy-web-app-hosting
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/firebase-tools:${_FIREBASE_TOOLS_VERSION}
    waitFor:
      - deploy-mastra-server
      - deploy-workflow-jobs
      - deploy-source-sync-scheduler
      - deploy-report-schedule-scheduler
      - deploy-activitypub-dispatcher-scheduler
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ "${_FIREBASE_DEPLOY}" != "true" ]]; then
          echo "Skipping Firebase App Hosting deploy because _FIREBASE_DEPLOY is not true."
          exit 0
        fi

        # apps/web に影響しない変更ならスキップ。
        # 最終成功 SHA が無い / 履歴に無い場合はデプロイ側に倒す。
        web_paths='^(apps/web/|firebase\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|packages/|infra/docker/firebase-tools/|deploy/examples/gcp-cloud-build/cloudbuild\.deploy\.yaml)'
        state_bucket="$$(node --experimental-strip-types scripts/apphosting-deploy-state.ts bucket --project "${PROJECT_ID}")"
        state_object="$$(node --experimental-strip-types scripts/apphosting-deploy-state.ts object-path --env "${_ENV}")"
        commit_sha="${COMMIT_SHA}"

        if git rev-parse --git-dir >/dev/null 2>&1; then
          last_success="$$(node --experimental-strip-types scripts/apphosting-deploy-state.ts read --bucket "$${state_bucket}" --object "$${state_object}" || true)"
          if [[ -n "$${last_success}" ]]; then
            if ! git cat-file -e "$${last_success}^{commit}" 2>/dev/null; then
              git fetch --deepen=200 >/dev/null 2>&1 || git fetch --unshallow >/dev/null 2>&1 || true
            fi
            if git cat-file -e "$${last_success}^{commit}" 2>/dev/null; then
              if [[ "$${last_success}" == "$${commit_sha}" ]]; then
                echo "App Hosting already deployed for $${commit_sha}. Skipping."
                exit 0
              fi
              if ! git diff --name-only "$${last_success}" HEAD | grep -qE "$${web_paths}"; then
                echo "No web-related changes since last successful deploy ($${last_success}). Skipping App Hosting deploy."
                exit 0
              fi
            else
              echo "Last success SHA $${last_success} is not in git history. Deploying App Hosting."
            fi
          else
            echo "No App Hosting last-success marker found. Deploying."
          fi
        else
          echo "Git metadata unavailable. Deploying App Hosting."
        fi

        firebase deploy --only apphosting --project "${PROJECT_ID}" --non-interactive

        node --experimental-strip-types scripts/apphosting-deploy-state.ts write \
          --bucket "$${state_bucket}" \
          --object "$${state_object}" \
          --sha "$${commit_sha}"
        echo "Recorded App Hosting last-success SHA $${commit_sha} at gs://$${state_bucket}/$${state_object}"

  - id: smoke
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_JOBS_IMAGE}:${SHORT_SHA}
    waitFor:
      - deploy-mastra-server
      - deploy-workflow-jobs
      - deploy-source-sync-scheduler
      - deploy-report-schedule-scheduler
      - deploy-activitypub-dispatcher-scheduler
      - deploy-web-app-hosting
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        MASTRA_SERVER_URL="$$(cat /workspace/.cloudbuild/mastra-server-url)" \
          SCHEDULER_SERVICE_ACCOUNT="${_SCHEDULER_SERVICE_ACCOUNT}" \
          ACTIVITYPUB_CANONICAL_ORIGIN="${_ACTIVITYPUB_CANONICAL_ORIGIN}" \
          node --experimental-strip-types /app/scripts/deploy-smoke.ts --env "${_ENV}"
